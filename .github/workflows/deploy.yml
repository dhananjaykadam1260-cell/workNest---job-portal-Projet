name: WorkNest CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # 3. Build Spring Boot project
      - name: Build Project
        run: mvn clean package -DskipTests


      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 5. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/worknest:latest


      # 6. Deploy to AWS EC2
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0

        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,MYSQL_ROOT_PASSWORD,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD

          script: |
            set -e

            APP_DIR="$HOME/worknest"

            echo "Deploying WorkNest..."


            # Clone repository first time
            if [ ! -d "$APP_DIR/.git" ]; then

              git clone https://github.com/dhananjaykadam1260-cell/workNest---job-portal-Projet.git "$APP_DIR"

            else

              cd "$APP_DIR"

              git fetch origin main
              git reset --hard origin/main

            fi


            cd "$APP_DIR"


            # Create environment file
            cat > .env <<EOF
            DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
            MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
            SPRING_MAIL_USERNAME=$SPRING_MAIL_USERNAME
            SPRING_MAIL_PASSWORD=$SPRING_MAIL_PASSWORD
            EOF


            chmod 600 .env


            # Login to Docker Hub
            echo "$DOCKERHUB_TOKEN" | docker login \
              -u "$DOCKERHUB_USERNAME" \
              --password-stdin


            # Pull latest Docker images
            docker compose pull


            # Start/update containers
            docker compose up -d --no-build


            # Remove old unused images
            docker image prune -f


            echo "Running containers:"
            docker ps


            echo "WorkNest deployed successfully."