<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Company | WorkNest</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
}

.card{
    border:none;
    border-radius:15px;
}

.card-header{
    border-radius:15px 15px 0 0 !important;
}

.form-control,
.form-select{
    border-radius:10px;
}

.btn{
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card shadow">

<div class="card-header bg-warning text-dark">

<h3 class="mb-0">

<i class="bi bi-building-gear"></i>

Edit Company Profile

</h3>

</div>

<div class="card-body">

<form th:action="@{/update-company}"
      method="post"
      th:object="${recruiter}">

<input type="hidden" th:field="*{id}">

<input type="hidden" th:field="*{password}">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Company Name

</label>

<input type="text"
class="form-control"
th:field="*{companyName}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Recruiter Name

</label>

<input type="text"
class="form-control"
th:field="*{recruiterName}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Official Email

</label>

<input type="email"
class="form-control"
th:field="*{email}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Phone Number

</label>

<input type="text"
class="form-control"
th:field="*{phone}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Website

</label>

<input type="url"
class="form-control"
th:field="*{website}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Location

</label>

<input type="text"
class="form-control"
th:field="*{location}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Company Type

</label>

<select class="form-select"
th:field="*{companyType}">

<option value="Startup">Startup</option>

<option value="Private Company">Private Company</option>

<option value="MNC">MNC</option>

<option value="Government">Government</option>

<option value="Consultancy">Consultancy</option>

<option value="IT Services">IT Services</option>

<option value="Product Company">Product Company</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Company Size

</label>

<select class="form-select"
th:field="*{companySize}">

<option value="1-10 Employees">1-10 Employees</option>

<option value="11-50 Employees">11-50 Employees</option>

<option value="51-200 Employees">51-200 Employees</option>

<option value="201-1000 Employees">201-1000 Employees</option>

<option value="1000+ Employees">1000+ Employees</option>

</select>

</div>

<div class="col-12 mb-4">

<label class="form-label">

Company Description

</label>

<textarea
class="form-control"
rows="6"
th:field="*{description}"></textarea>

</div>

<div class="text-center">

<button type="submit"
class="btn btn-success btn-lg me-2">

<i class="bi bi-check-circle-fill"></i>

Update Company

</button>

<a href="/recruiter-dashboard"
class="btn btn-secondary btn-lg">

<i class="bi bi-arrow-left-circle"></i>

Cancel

</a>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
