<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>My Jobs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>

<i class="bi bi-briefcase-fill"></i>

My Posted Jobs

</h3>

</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>ID</th>

<th>Job Title</th>

<th>Category</th>

<th>Location</th>

<th>Salary</th>

<th>Experience</th>

<th>Type</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr th:each="job : ${jobs}">

<td th:text="${job.id}"></td>

<td th:text="${job.jobTitle}"></td>

<td th:text="${job.category}"></td>

<td th:text="${job.location}"></td>

<td th:text="${job.salary}"></td>

<td th:text="${job.experience}"></td>

<td th:text="${job.jobType}"></td>

<td>

<a th:href="@{/edit-job/{id}(id=${job.id})}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{/delete-job/{id}(id=${job.id})}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this job?')">

Delete

</a>

</td>

</tr>

</tbody>

</table>

<a href="/recruiter-dashboard"
class="btn btn-secondary">

Back

</a>

</div>

</div>

</div>

</body>

</html>
