<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorkNest | Recruiter Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f7fb;
    font-family:'Segoe UI',sans-serif;
}

.login-section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 0;
}

.card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
}

.left-panel{
    background:#0d6efd;
    color:#fff;
    padding:60px 40px;
}

.left-panel i{
    font-size:70px;
}

.left-panel h2{
    font-weight:700;
    margin-top:20px;
}

.form-control{
    border-radius:10px;
    height:50px;
}

.btn-primary{
    border-radius:10px;
    height:50px;
    font-weight:600;
}

.form-check-input{
    cursor:pointer;
}

a{
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

@media(max-width:991px){

.left-panel{
    text-align:center;
}

}

</style>

</head>

<body>

<section class="login-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card">

<div class="row g-0">

<!-- Left Panel -->

<div class="col-lg-5">

<div class="left-panel h-100 d-flex flex-column justify-content-center">

<i class="bi bi-buildings-fill"></i>

<h2>Recruiter Login</h2>

<p class="mt-3">

Welcome back!

Login to your recruiter account to post jobs,
manage applications, and hire the best talent with WorkNest.

</p>

</div>

</div>

<!-- Right Panel -->

<div class="col-lg-7">

<div class="p-5">

<h3 class="fw-bold mb-4">

Sign In

</h3>

<form action="/recruiter-login" method="post">

<div class="mb-3">

<label class="form-label">

Official Email

</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your company email"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

<div class="d-flex justify-content-between mb-4">



<a href="/recruiter/forgot-password">
    Forgot Password?
</a>

</div>

<button
type="submit"
class="btn btn-primary w-100">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</form>

<hr class="my-4">

<div class="text-center">

<p class="mb-2">

Don't have a recruiter account?

</p>

<a
href="/recruiter-register"
class="btn btn-outline-primary">

Create Recruiter Account

</a>

</div>

<div class="text-center mt-4">

<a href="/">

<i class="bi bi-arrow-left"></i>

Back to Home

</a>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
