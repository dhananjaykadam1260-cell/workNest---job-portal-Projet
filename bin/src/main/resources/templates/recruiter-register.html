<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkNest | Recruiter Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .register-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
            overflow: hidden;
        }

        .left-panel {
            background: #0d6efd;
            color: white;
            padding: 50px;
            border-radius: 20px 0 0 20px;
        }

        .left-panel h2 {
            font-weight: bold;
        }

        .left-panel i {
            font-size: 70px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .15);
        }

        .btn-primary {
            border-radius: 10px;
        }

        .password-error {
            font-size: 14px;
            margin-top: 5px;
        }

        @media (max-width: 991px) {
            .left-panel {
                border-radius: 20px 20px 0 0;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<section class="register-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-11">

                <div class="card">

                    <div class="row g-0">

                        <div class="col-lg-4">

                            <div class="left-panel h-100 d-flex flex-column justify-content-center">

                                <i class="bi bi-buildings-fill mb-4"></i>

                                <h2>Recruiter Registration</h2>

                                <p class="mt-3">
                                    Join WorkNest and hire skilled professionals from across India.
                                    Post jobs, manage applicants and build your employer brand.
                                </p>

                            </div>

                        </div>

                        <div class="col-lg-8">

                            <div class="p-5">

                                <h3 class="fw-bold mb-4">
                                    Create Recruiter Account
                                </h3>

                                <div th:if="${error}"
                                     class="alert alert-danger"
                                     role="alert"
                                     th:text="${error}">
                                </div>

                                <form th:action="@{/recruiter-register}"
                                      method="post"
                                      onsubmit="return validatePassword()">

                                    <div class="row">

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Company Name
                                            </label>

                                            <input type="text"
                                                   name="companyName"
                                                   class="form-control"
                                                   placeholder="Enter company name"
                                                   required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                HR / Recruiter Name
                                            </label>

                                            <input type="text"
                                                   name="recruiterName"
                                                   class="form-control"
                                                   placeholder="Enter recruiter name"
                                                   required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Official Email
                                            </label>

                                            <input type="email"
                                                   name="email"
                                                   class="form-control"
                                                   placeholder="recruiter@company.com"
                                                   required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Phone Number
                                            </label>

                                            <input type="tel"
                                                   name="phone"
                                                   class="form-control"
                                                   placeholder="Enter phone number"
                                                   required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Company Website
                                            </label>

                                            <input type="url"
                                                   name="website"
                                                   class="form-control"
                                                   placeholder="https://example.com">

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Location
                                            </label>

                                            <input type="text"
                                                   name="location"
                                                   class="form-control"
                                                   placeholder="Enter company location"
                                                   required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Company Type
                                            </label>

                                            <select name="companyType"
                                                    class="form-select"
                                                    required>

                                                <option value="">
                                                    Select
                                                </option>

                                                <option value="Startup">
                                                    Startup
                                                </option>

                                                <option value="Private Company">
                                                    Private Company
                                                </option>

                                                <option value="MNC">
                                                    MNC
                                                </option>

                                                <option value="Government">
                                                    Government
                                                </option>

                                                <option value="Consultancy">
                                                    Consultancy
                                                </option>

                                                <option value="IT Services">
                                                    IT Services
                                                </option>

                                                <option value="Product Company">
                                                    Product Company
                                                </option>

                                            </select>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Company Size
                                            </label>

                                            <select name="companySize"
                                                    class="form-select"
                                                    required>

                                                <option value="">
                                                    Select
                                                </option>

                                                <option value="1-10 Employees">
                                                    1-10 Employees
                                                </option>

                                                <option value="11-50 Employees">
                                                    11-50 Employees
                                                </option>

                                                <option value="51-200 Employees">
                                                    51-200 Employees
                                                </option>

                                                <option value="201-1000 Employees">
                                                    201-1000 Employees
                                                </option>

                                                <option value="1000+ Employees">
                                                    1000+ Employees
                                                </option>

                                            </select>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Password
                                            </label>

                                            <input type="password"
                                                   id="password"
                                                   name="password"
                                                   class="form-control"
                                                   placeholder="Minimum 6 characters"
                                                   minlength="6"
                                                   required>

                                        </div>

                                        <div class="col-md-6 mb-3">

                                            <label class="form-label">
                                                Confirm Password
                                            </label>

                                            <input type="password"
                                                   id="confirmPassword"
                                                   name="confirmPassword"
                                                   class="form-control"
                                                   placeholder="Re-enter password"
                                                   minlength="6"
                                                   required>

                                            <div id="passwordError"
                                                 class="text-danger password-error">
                                            </div>

                                        </div>

                                        <div class="col-12 mb-3">

                                            <label class="form-label">
                                                Company Description
                                            </label>

                                            <textarea name="description"
                                                      class="form-control"
                                                      rows="4"
                                                      placeholder="Enter company description"></textarea>

                                        </div>

                                        <div class="col-12 mb-3 form-check">

                                            <input type="checkbox"
                                                   id="terms"
                                                   name="terms"
                                                   value="accepted"
                                                   class="form-check-input"
                                                   required>

                                            <label for="terms"
                                                   class="form-check-label">

                                                I agree to the Terms & Conditions.

                                            </label>

                                        </div>

                                        <div class="col-12">

                                            <button type="submit"
                                                    class="btn btn-primary w-100 btn-lg">

                                                <i class="bi bi-building-add"></i>

                                                Create Recruiter Account

                                            </button>

                                        </div>

                                    </div>

                                </form>

                                <hr>

                                <p class="text-center mt-4">

                                    <a th:href="@{/recruiter-login}"
                                       class="text-decoration-none">

                                        Already have an account? Login

                                    </a>

                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

function validatePassword() {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const passwordError =
        document.getElementById("passwordError");

    if (password.length < 6) {

        passwordError.textContent =
            "Password must contain at least 6 characters.";

        return false;
    }

    if (password !== confirmPassword) {

        passwordError.textContent =
            "Passwords do not match.";

        return false;
    }

    passwordError.textContent = "";

    return true;
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
