<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Recruiter Password | WorkNest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 450px;

            border: none;
            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        .icon {
            font-size: 55px;
            color: #0d6efd;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card p-4">

    <div class="text-center mb-4">

        <i class="bi bi-key-fill icon"></i>

        <h3 class="fw-bold mt-3">
            Create New Password
        </h3>

        <p class="text-muted">
            Enter your new recruiter account password.
        </p>

    </div>


    <div th:if="${error}"
         class="alert alert-danger">

        <span th:text="${error}"></span>

    </div>


    <form action="/recruiter/reset-password"
          method="post"
          id="resetForm">

        <div class="mb-3">

            <label class="form-label">
                New Password
            </label>

            <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="6"
                    required>

        </div>


        <div class="mb-4">

            <label class="form-label">
                Confirm Password
            </label>

            <input
                    type="password"
                    name="confirmPassword"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="6"
                    required>

        </div>


        <button
                type="submit"
                class="btn btn-primary w-100">

            <i class="bi bi-shield-check"></i>

            Reset Password

        </button>

    </form>

</div>


<script>

document.getElementById("resetForm")
.addEventListener("submit", function(event) {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {

        event.preventDefault();

        alert("Passwords do not match.");

    }

});

</script>

</body>

</html>
