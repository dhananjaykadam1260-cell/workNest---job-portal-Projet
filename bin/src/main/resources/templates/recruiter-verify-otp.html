<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | WorkNest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 450px;

            border: none;
            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        .icon {
            font-size: 55px;
            color: #0d6efd;
        }

        .form-control {
            height: 55px;
            border-radius: 10px;

            text-align: center;
            font-size: 22px;
            letter-spacing: 8px;
        }

        .btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card p-4">

    <div class="text-center mb-4">

        <i class="bi bi-patch-check-fill icon"></i>

        <h3 class="fw-bold mt-3">
            Verify OTP
        </h3>

        <p class="text-muted">
            Enter the 6-digit OTP sent to
        </p>

        <strong th:text="${email}">
        </strong>

    </div>


    <div th:if="${error}"
         class="alert alert-danger">

        <span th:text="${error}"></span>

    </div>


    <form action="/recruiter/verify-otp"
          method="post">

        <div class="mb-4">

            <input
                    type="text"
                    name="otp"
                    class="form-control"
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required>

        </div>


        <button
                type="submit"
                class="btn btn-primary w-100">

            <i class="bi bi-check-circle"></i>

            Verify OTP

        </button>

    </form>


    <hr>


    <div class="text-center">

        <a href="/recruiter/forgot-password"
           class="text-decoration-none">

            Request New OTP

        </a>

    </div>

</div>

</body>

</html>
