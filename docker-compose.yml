services:

  mysql:
    image: mysql:8.4
    container_name: worknest-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: job_portal
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: worknest
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - worknest-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  worknest:
    build:
      context: .
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME:-dhanu3392}/worknest:latest

    container_name: worknest-app

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      SPRING_DATASOURCE_USERNAME: worknest

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}

      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    ports:
      - "8080:8080"

    networks:
      - worknest-network


volumes:
  mysql_data:


networks:
  worknest-network:
    driver: bridge