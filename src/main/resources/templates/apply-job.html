<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply Job | WorkNest</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.section-title{
    color:#0d6efd;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container py-5">

<div class="card">

<div class="card-body">

<h2 class="text-primary mb-4">
<i class="bi bi-briefcase-fill"></i>
Apply for Job
</h2>

<div th:if="${success}" class="alert alert-success">
<span th:text="${success}"></span>
</div>

<div th:if="${error}" class="alert alert-danger">
<span th:text="${error}"></span>
</div>

<form th:action="@{/apply}" method="post">

<input type="hidden" name="jobId" th:value="${job.id}">

<h5 class="section-title mb-3">
Candidate Information
</h5>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input type="text"
class="form-control"
th:value="${user.name}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input type="email"
class="form-control"
th:value="${user.email}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Mobile</label>

<input type="text"
class="form-control"
th:value="${user.mobile}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">City</label>

<input type="text"
class="form-control"
th:value="${user.city}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Qualification</label>

<input type="text"
class="form-control"
th:value="${user.qualification}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Experience</label>

<input type="text"
class="form-control"
th:value="${user.experience}"
readonly>

</div>

</div>

<hr>

<h5 class="section-title mb-3">
Job Details
</h5>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Job Title</label>

<input type="text"
class="form-control"
th:value="${job.jobTitle}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Company</label>

<input type="text"
class="form-control"
th:value="${job.companyName}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Location</label>

<input type="text"
class="form-control"
th:value="${job.location}"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Salary</label>

<input type="text"
class="form-control"
th:value="${job.salary}"
readonly>

</div>

</div>

<hr>

<h5 class="section-title mb-3">
Uploaded Resume
</h5>

<div th:if="${resume != null}">

<div class="alert alert-success">

<i class="bi bi-file-earmark-pdf-fill"></i>

<strong th:text="${resume.fileName}"></strong>

<a href="/resume/download" class="btn btn-success btn-sm float-end">

<i class="bi bi-download"></i>

Download

</a>

</div>

</div>

<div th:if="${resume == null}" class="alert alert-danger">

No resume uploaded.

Please upload your resume before applying.

<br><br>

<a href="/resume" class="btn btn-primary">

Upload Resume

</a>

</div>

<hr>

<h5 class="section-title mb-3">
Cover Letter (Optional)
</h5>

<textarea
name="coverLetter"
class="form-control"
rows="6"
placeholder="Write a short cover letter..."></textarea>

<div class="mt-4">

<button
class="btn btn-primary"
th:disabled="${resume == null}">

<i class="bi bi-send-fill"></i>

Submit Application

</button>

<a href="/jobs" class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

</body>

</html>
