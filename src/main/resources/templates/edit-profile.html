<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkNest | Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .navbar{
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold text-primary" href="/dashboard">
            WorkNest
        </a>

        <div class="ms-auto">

            Welcome,
            <strong th:text="${user.name}"></strong>

            <a href="/logout" class="btn btn-outline-danger ms-3">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i>
                        Edit Profile
                    </h4>

                </div>

                <div class="card-body">

                    <form th:action="@{/profile/update}" th:object="${user}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">

                            <label class="form-label">Full Name</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{name}"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Email</label>

                            <input
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Mobile</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{mobile}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">City</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{city}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Qualification</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{qualification}">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Experience</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{experience}">

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/profile" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i>
                                Back
                            </a>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i>
                                Update Profile
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
