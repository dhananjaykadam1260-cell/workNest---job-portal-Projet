<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Job Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-body">

<h2 th:text="${job.jobTitle}"></h2>

<hr>

<p>

<strong>Company :</strong>

<span th:text="${job.companyName}"></span>

</p>

<p>

<strong>Location :</strong>

<span th:text="${job.location}"></span>

</p>

<p>

<strong>Salary :</strong>

<span th:text="${job.salary}"></span>

</p>

<p>

<strong>Experience :</strong>

<span th:text="${job.experience}"></span>

</p>

<p>

<strong>Job Type :</strong>

<span th:text="${job.jobType}"></span>

</p>

<p>

<strong>Category :</strong>

<span th:text="${job.category}"></span>

</p>

<p>

<strong>Description :</strong>

</p>

<p th:text="${job.description}">
Job Description
</p>

<p>

<strong>Posted On :</strong>

<span th:text="${job.postedDate}"></span>

</p>

<hr>

<a href="/jobs" class="btn btn-secondary">
Back
</a>

<a th:href="@{/apply/{id}(id=${job.id})}"
   class="btn btn-primary">
    Apply Now
</a>

</div>

</div>

</div>

</body>
</html>
