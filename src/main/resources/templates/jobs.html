<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkNest | Browse Jobs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .sidebar{
            min-height:100vh;
            background:#0d6efd;
        }

        .sidebar a{
            color:#fff;
            text-decoration:none;
            display:block;
            padding:14px 20px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,.15);
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .navbar{
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .job-card{
            transition:.2s;
        }

        .job-card:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(0,0,0,.1);
        }

        .job-icon{
            width:55px;
            height:55px;
            border-radius:12px;
            background:#e7f0ff;
            color:#0d6efd;
            font-size:24px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .badge-soft{
            background:#e7f0ff;
            color:#0d6efd;
            font-weight:500;
        }
    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold text-primary" href="/dashboard">
            WorkNest
        </a>

        <div class="ms-auto">

            <span class="me-3">
                Welcome,
                <strong th:text="${loggedUser.name}">User</strong>
            </span>

            <a href="/logout" class="btn btn-outline-danger">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 sidebar p-0">

            <h4 class="text-white text-center py-4">
                Dashboard
            </h4>

            <a href="/dashboard"><i class="bi bi-house-door me-2"></i>Home</a>
            <a href="/jobs"><i class="bi bi-search me-2"></i>Browse Jobs</a>
            <a href="/applied-jobs"><i class="bi bi-file-earmark-text me-2"></i>Applied Jobs</a>
            <a th:href="@{/scheduled-interviews}" class="active">
    <i class="bi bi-calendar-check me-2"></i>
    Scheduled Interviews
</a>
            <a href="/profile"><i class="bi bi-person me-2"></i>Profile</a>
            <a href="/resume"><i class="bi bi-file-earmark-arrow-up me-2"></i>Resume</a>
            <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="mb-0">
                    Browse Jobs
                </h2>

                <span class="badge badge-soft fs-6" th:text="${#lists.size(jobs)} + ' Jobs Available'">
                    0 Jobs Available
                </span>

            </div>

            <div th:if="${#lists.isEmpty(jobs)}" class="card">
                <div class="card-body text-center p-5 text-muted">
                    <i class="bi bi-briefcase fs-1 d-block mb-3"></i>
                    No jobs posted yet. Check back soon.
                </div>
            </div>

            <div class="row">

                <div class="col-md-6 mb-4" th:each="job : ${jobs}">

                    <div class="card job-card h-100">

                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-start mb-3">

                                <div class="d-flex gap-3">

                                    <div class="job-icon">
                                        <i class="bi bi-building"></i>
                                    </div>

                                    <div>
                                        <h5 class="mb-1" th:text="${job.jobTitle}">Job Title</h5>
                                        <p class="text-muted mb-0" th:text="${job.companyName}">Company Name</p>
                                    </div>

                                </div>

                                <span class="badge bg-success" th:if="${job.jobType != null}" th:text="${job.jobType}">
                                    Full Time
                                </span>

                            </div>

                            <div class="d-flex flex-wrap gap-3 mb-3 text-muted small">

                                <span th:if="${job.location != null}">
                                    <i class="bi bi-geo-alt"></i>
                                    <span th:text="${job.location}">Location</span>
                                </span>

                                <span th:if="${job.salary != null}">
                                    <i class="bi bi-cash-stack"></i>
                                    <span th:text="${job.salary}">Salary</span>
                                </span>

                                <span th:if="${job.experience != null}">
                                    <i class="bi bi-briefcase"></i>
                                    <span th:text="${job.experience}">Experience</span>
                                </span>

                            </div>

                            <p class="text-muted mb-3" th:if="${job.category != null}">
                                <span class="badge badge-soft" th:text="${job.category}">Category</span>
                            </p>

                            <div class="d-flex justify-content-between align-items-center mt-3">

                                <small class="text-muted">
                                    Posted:
                                    <span th:text="${job.postedDate}">-</span>
                                </small>

                                <a th:href="@{/job-details/{id}(id=${job.id})}"
                                   class="btn btn-primary btn-sm">
                                    View Details
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
