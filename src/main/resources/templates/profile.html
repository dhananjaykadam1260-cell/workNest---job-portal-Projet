<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkNest | My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{
            min-height:100vh;
            background:#0d6efd;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 20px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,.15);
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
        }

        .profile-icon{
            width:120px;
            height:120px;
            border-radius:50%;
            background:#0d6efd;
            color:white;
            font-size:55px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
        }

        .section-title{
            font-weight:bold;
            color:#0d6efd;
            margin-bottom:20px;
        }

        .info-label{
            font-weight:600;
            color:#555;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold text-primary" href="/dashboard">
            WorkNest
        </a>

        <div class="ms-auto">

            Welcome,

            <strong th:text="${loggedUser.name}"></strong>

            <a href="/logout" class="btn btn-outline-danger ms-3">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

    </div>

</nav>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 sidebar p-0">

            <h4 class="text-center text-white py-4">

                Dashboard

            </h4>

            <a href="/dashboard"><i class="bi bi-house-door me-2"></i>Home</a>
            <a href="/jobs"><i class="bi bi-search me-2"></i>Browse Jobs</a>
            <a href="/applied-jobs"><i class="bi bi-file-earmark-text me-2"></i>Applied Jobs</a>
            <a th:href="@{/scheduled-interviews}" class="active">
    <i class="bi bi-calendar-check me-2"></i>
    Scheduled Interviews
</a>
            <a href="/profile"><i class="bi bi-person me-2"></i>Profile</a>
            <a href="/resume"><i class="bi bi-file-earmark-arrow-up me-2"></i>Resume</a>
            <a href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            <h2 class="mb-4">

                My Profile

            </h2>

            <!-- Profile Card -->

            <div class="card">

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-3 text-center">

                            <div class="profile-icon">

                                <i class="bi bi-person-fill"></i>

                            </div>

                            <h4 class="mt-3"

                                th:text="${loggedUser.name}">

                                User

                            </h4>

                        </div>

                        <div class="col-md-9">

                            <h4 class="section-title">

                                Personal Information

                            </h4>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <div class="info-label">

                                        Full Name

                                    </div>

                                    <div th:text="${loggedUser.name}"></div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <div class="info-label">

                                        Email

                                    </div>

                                    <div th:text="${loggedUser.email}"></div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <div class="info-label">

                                        Mobile

                                    </div>

                                    <div th:text="${loggedUser.mobile}"></div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <div class="info-label">

                                        City

                                    </div>

                                    <div th:text="${loggedUser.city}"></div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <div class="info-label">

                                        Qualification

                                    </div>

                                    <div th:text="${loggedUser.qualification}"></div>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <div class="info-label">

                                        Experience

                                    </div>

                                    <div th:text="${loggedUser.experience}"></div>

                                </div>

                                <div class="col-md-12">

                                    <a href="/profile/edit"

                                       class="btn btn-primary">

                                        <i class="bi bi-pencil-square"></i>

                                        Edit Profile

                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
            
                        <!-- Success Message -->

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-4">

                <span th:text="${success}"></span>

                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

            </div>

            <!-- Error Message -->

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-4">

                <span th:text="${error}"></span>

                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

            </div>

            

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
